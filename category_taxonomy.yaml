# YT 演講摘要 — 分類 taxonomy
# Phase 4 分類治理：取代「LLM 自由命名 category」的舊模式。
# 改 yaml 後重跑 recategorize.py 即可重分既有摘要。

taxonomy:
  投資/經濟:
    - 個股拆解
    - 宏觀經濟
    - 商品/原物料
    - 全球地緣
    - 市場觀點/策略

  AI/科技:
    - AI 應用/Agent
    - 技術趨勢
    - 開源工具

  思想/個人成長:
    - 職涯/抉擇
    - 人生哲學
    - 教育/未來見解
    - 政治/社會反思

  健康/科學:
    - 健身/體能
    - 飲食/代謝
    - 抗衰老/前沿醫學
    - 心理/腦科學
    - 環境/氣候

  演講/溝通:
    - 表達技巧
    - 人際溝通

  人文/玄學:
    - 易學/術數
    - 玄學/前世
    - 命理/預言

# 過時主類折疊：舊摘要或 LLM 偶爾輸出這些舊名時，gen_index normalize 會導向 canonical
# 子類由 recategorize.py 重判（alias 只折主類，不擅自指定子類）
aliases:
  政治/歷史: 思想/個人成長
  社會/政治: 思想/個人成長
  易學/術數: 人文/玄學

# 工具產物或非摘要檔案，gen_index.py 跳過
skip_files:
  - 心智圖總覽.md
